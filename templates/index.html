<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pensieve</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --gold-dim: #7a5c1e;
    --bg: #0d0b07;
    --bg2: #13100a;
    --bg3: #1a1610;
    --border: rgba(201,168,76,0.18);
    --border-strong: rgba(201,168,76,0.4);
    --text: #e8dfc8;
    --text-dim: #8a7d62;
    --user-bubble: #1e1a12;
    --bot-bubble: #16130d;
    --radius: 16px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Subtle parchment texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(201,168,76,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(100,60,10,0.1) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  header {
    position: relative;
    z-index: 10;
    padding: 20px 32px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, rgba(20,16,8,0.95) 0%, rgba(13,11,7,0.8) 100%);
    backdrop-filter: blur(8px);
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .crest {
    width: 42px;
    height: 42px;
    border: 1.5px solid var(--gold-dim);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--gold);
    background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
    animation: crестglow 4s ease-in-out infinite;
  }

  @keyframes crестglow {
    0%, 100% { box-shadow: 0 0 8px rgba(201,168,76,0.15); }
    50% { box-shadow: 0 0 20px rgba(201,168,76,0.35), 0 0 40px rgba(201,168,76,0.08); }
  }

  .title-group h1 {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.08em;
    line-height: 1.2;
  }

  .title-group p {
    font-size: 12px;
    color: var(--text-dim);
    font-style: italic;
    letter-spacing: 0.04em;
    margin-top: 2px;
  }

  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 16px;
    border-radius: 20px;
    font-family: 'Crimson Pro', serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 0.04em;
  }

  .reset-btn:hover {
    border-color: var(--gold-dim);
    color: var(--gold);
    background: rgba(201,168,76,0.05);
  }

  /* Chat area */
  #chat {
    position: relative;
    z-index: 5;
    flex: 1;
    overflow-y: auto;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

  /* Message rows */
  .msg-row {
    display: flex;
    gap: 12px;
    max-width: 780px;
    width: 100%;
    animation: msgIn 0.35s cubic-bezier(0.34,1.3,0.64,1) both;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(12px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.bot  { align-self: flex-start; }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .avatar.bot-av {
    background: radial-gradient(circle, rgba(201,168,76,0.15), transparent);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
  }

  .avatar.user-av {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-dim);
  }

  .bubble {
    padding: 13px 18px;
    border-radius: var(--radius);
    font-size: 16.5px;
    line-height: 1.65;
    max-width: 600px;
  }

  .msg-row.user .bubble {
    background: var(--user-bubble);
    border: 1px solid rgba(255,255,255,0.07);
    border-bottom-right-radius: 4px;
    color: var(--text);
  }

  .msg-row.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  /* Typing indicator */
  .typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 18px;
  }

  .typing span {
    width: 7px;
    height: 7px;
    background: var(--gold-dim);
    border-radius: 50%;
    animation: blink 1.2s ease-in-out infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.1); }
  }

  /* Divider line */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    align-self: center;
    opacity: 0.4;
    margin: 4px 0;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim));
  }

  .divider::after { background: linear-gradient(90deg, var(--gold-dim), transparent); }
  .divider span { font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em; font-family: 'Cinzel', serif; }

  /* Input area */
  footer {
    position: relative;
    z-index: 10;
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    background: linear-gradient(0deg, rgba(13,11,7,0.98) 0%, rgba(13,11,7,0.7) 100%);
    backdrop-filter: blur(8px);
  }

  .input-wrap {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 10px 10px 20px;
    transition: border-color 0.25s;
  }

  .input-wrap:focus-within {
    border-color: var(--gold-dim);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.06);
  }

  #input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Crimson Pro', serif;
    font-size: 16.5px;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    padding: 2px 0;
  }

  #input::placeholder { color: var(--text-dim); font-style: italic; }

  #send {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-dim), var(--gold));
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    color: #0d0b07;
  }

  #send:hover { transform: scale(1.08); box-shadow: 0 0 16px rgba(201,168,76,0.4); }
  #send:active { transform: scale(0.95); }
  #send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  #send svg { width: 16px; height: 16px; }

  .hint {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 10px;
    font-style: italic;
    letter-spacing: 0.03em;
  }

  /* Welcome message */
  .welcome {
    align-self: center;
    text-align: center;
    padding: 40px 20px;
    max-width: 440px;
  }

  .welcome .wand { font-size: 36px; margin-bottom: 16px; }

  .welcome h2 {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 10px;
  }

  .welcome p {
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1.7;
    font-style: italic;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 20px;
  }

  .sug {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 14px;
    border-radius: 20px;
    font-family: 'Crimson Pro', serif;
    font-size: 13.5px;
    cursor: pointer;
    transition: all 0.2s;
    font-style: italic;
  }

  .sug:hover {
    border-color: var(--gold-dim);
    color: var(--gold-light);
    background: rgba(201,168,76,0.05);
  }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <div class="crest">⚡</div>
    <div class="title-group">
      <h1>Pensieve</h1>
      <p>Dive into the memories of the wizarding world</p>
    </div>
  </div>
  <button class="reset-btn" onclick="resetChat()">✦ New Conversation</button>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <div class="wand">🪄</div>
    <h2>Mischief Managed</h2>
    <p>Ask me anything about the wizarding world — characters, spells, houses, and more. I shall answer only what is written in the ancient texts.</p>
    <div class="suggestions">
      <button class="sug" onclick="sendSuggestion(this)">Who is Harry Potter?</button>
      <button class="sug" onclick="sendSuggestion(this)">What are the four houses?</button>
      <button class="sug" onclick="sendSuggestion(this)">Who teaches Potions?</button>
      <button class="sug" onclick="sendSuggestion(this)">What does the Sorting Hat do?</button>
    </div>
  </div>
</div>

<footer>
  <div class="input-wrap">
    <textarea id="input" rows="1" placeholder="Ask about the wizarding world..." maxlength="500"></textarea>
    <button id="send" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
  <p class="hint">Abdullah Hani Al-Shobaki & Abdulah M. M. Abbas · Press Enter to send</p>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let welcomeRemoved = false;

function removeWelcome() {
  if (!welcomeRemoved) {
    const w = document.getElementById('welcome');
    if (w) w.remove();
    welcomeRemoved = true;
  }
}

function addDivider() {
  const d = document.createElement('div');
  d.className = 'divider';
  d.innerHTML = '<span>✦</span>';
  chat.appendChild(d);
}

function addMessage(text, role) {
  removeWelcome();
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const av = document.createElement('div');
  av.className = `avatar ${role === 'bot' ? 'bot-av' : 'user-av'}`;
  av.textContent = role === 'bot' ? '⚡' : '✦';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  row.appendChild(av);
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typing-row';
  const av = document.createElement('div');
  av.className = 'avatar bot-av';
  av.textContent = '⚡';
  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(av);
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing-row');
  if (t) t.remove();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;

  addMessage(text, 'user');
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    hideTyping();
    addMessage(data.reply, 'bot');
  } catch (e) {
    hideTyping();
    addMessage('The magic seems to be disrupted. Please try again.', 'bot');
  }

  sendBtn.disabled = false;
  input.focus();
}

async function resetChat() {
  await fetch('/reset', { method: 'POST' });
  chat.innerHTML = '';
  welcomeRemoved = false;
  const welcome = document.createElement('div');
  welcome.className = 'welcome';
  welcome.id = 'welcome';
  welcome.innerHTML = `
    <div class="wand">🪄</div>
    <h2>Mischief Managed</h2>
    <p>Ask me anything about the wizarding world — characters, spells, houses, and more.</p>
    <div class="suggestions">
      <button class="sug" onclick="sendSuggestion(this)">Who is Harry Potter?</button>
      <button class="sug" onclick="sendSuggestion(this)">What are the four houses?</button>
      <button class="sug" onclick="sendSuggestion(this)">Who teaches Potions?</button>
      <button class="sug" onclick="sendSuggestion(this)">What does the Sorting Hat do?</button>
    </div>`;
  chat.appendChild(welcome);
}

function sendSuggestion(btn) {
  input.value = btn.textContent;
  sendMessage();
}

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// Enter to send (Shift+Enter for newline)
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
</script>
</body>
</html>
